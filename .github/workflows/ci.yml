name: ci
on:
  push: {}
  pull_request: {}
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check.mjs
      - run: node scripts/verify-contracts.mjs
      - run: npx eslint .
      - run: pnpm --filter @alta/client test
      - run: pnpm --filter @alta/platform test
      - run: pnpm --filter @alta/web exec vite build
      - run: pnpm --filter @alta/desktop exec vite build
      - run: pnpm --filter @alta/storybook exec vite build
      - run: node scripts/check-budgets.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-build
          path: apps/web/build
          retention-days: 7
